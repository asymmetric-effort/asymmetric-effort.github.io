name: Deploy
on:
  push:
    branches: [main, dev]
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Deploy
        uses: asymmetric-effort/actions/actions/deploy-pages@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: ${{ github.ref == 'refs/heads/main' && 'gh-pages' || 'dev-pages' }}
          cname: ${{ github.ref == 'refs/heads/main' && 'asymmetric-effort.com' || 'dev.asymmetric-effort.com' }}

  pdv:
    name: Post-Deployment Verification
    needs: build-and-deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Build to determine expected JS hash
        run: npm run build
      - name: Determine expected JS hash
        id: hash
        run: |
          JS_FILE=$(ls dist/assets/index-*.js 2>/dev/null | head -1 | xargs basename)
          echo "js_file=$JS_FILE" >> "$GITHUB_OUTPUT"
      - name: Wait for deployment to propagate
        run: |
          BASE="https://asymmetric-effort.com"
          if [ "$GITHUB_REF" = "refs/heads/dev" ]; then
            BASE="https://dev.asymmetric-effort.com"
          fi
          EXPECTED="${{ steps.hash.outputs.js_file }}"
          echo "Waiting for CDN to serve $EXPECTED..."
          for i in $(seq 1 40); do
            SERVED=$(curl -s "$BASE/" | grep -oP 'index-[a-zA-Z0-9]+\.js' || true)
            if [ "$SERVED" = "$EXPECTED" ]; then
              echo "CDN updated after $((i * 15)) seconds"
              exit 0
            fi
            echo "Attempt $i: CDN serving $SERVED, expected $EXPECTED"
            sleep 15
          done
          echo "WARNING: CDN did not update after 10 minutes"
          exit 1
      - name: Set base URL
        id: url
        run: |
          if [ "$GITHUB_REF" = "refs/heads/dev" ]; then
            echo "base_url=https://dev.asymmetric-effort.com" >> "$GITHUB_OUTPUT"
          else
            echo "base_url=https://asymmetric-effort.com" >> "$GITHUB_OUTPUT"
          fi
      - name: Run PDV tests
        env:
          PDV_BASE_URL: ${{ steps.url.outputs.base_url }}
        run: npx playwright test
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pdv-report
          path: playwright-report/
          retention-days: 14
